    location: Berlin
    description_text: Redesign commercial claims and billing workflows, reduce aged deductions, automate validations and improve partner onboarding. Own cross-functional programs with Sales, Finance and engineering, write requirements, lead UAT and build leadership reporting in SQL and Looker. Seven years of commercial operations and change-management experience required. English is the working language; German helpful.

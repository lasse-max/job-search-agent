    department: Commercial Operations
    location: London
    description_text: Lead operating-model change across partner operations, Finance and GTM. Own the program roadmap, stakeholder governance, revenue-leakage remediation and process automation. Drive training and adoption across international partners. Six to eight years of business operations or program management experience, advanced spreadsheets and working SQL required. No direct reports.

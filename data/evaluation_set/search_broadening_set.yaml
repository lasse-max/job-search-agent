    department: Business Operations
    location: London
    description_text: Own global partner onboarding and a cross-functional commercial transformation program. Translate Sales and Finance requirements into workflows, coordinate engineering delivery, lead UAT and rollout, build SQL dashboards and report business outcomes to executives. Seven years of business program experience required. This is a senior individual-contributor role with no coding or technical-degree requirement.

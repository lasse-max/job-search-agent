name: Scheduled Scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_stale_backfill:
        description: "Re-evaluate every stale current-policy posting in one controlled pass"
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SQLite state
        uses: actions/cache@v4
        with:
          path: data/job_search_agent.sqlite
          key: job-search-agent-db-${{ github.run_id }}
          restore-keys: |
            job-search-agent-db-

      - name: Restore model spend ledger
        id: model-spend
        uses: actions/cache/restore@v4
        with:
          path: data/model_spend_ledger.json
          key: job-agent-model-spend-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-agent-model-spend-v1-

      - name: Warn when prior tracked spend is unavailable
        if: ${{ steps.model-spend.outputs.cache-matched-key == '' }}
        run: echo "::warning title=Model spend history unavailable::No retained spend ledger. Reconcile provider month-to-date usage before any full backfill; the configured cap cannot account for missing history."

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run scheduled scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          JOB_AGENT_DATABASE_URL: ${{ secrets.JOB_AGENT_DATABASE_URL }}
          MONTHLY_MODEL_SPEND_CAP_USD: "30"
          STALE_EVALUATION_BACKFILL_LIMIT: ${{ inputs.full_stale_backfill && '10000' || '25' }}
        run: job-agent scan-all

      - name: Save model spend ledger even after a failed scan
        if: ${{ always() && hashFiles('data/model_spend_ledger.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/model_spend_ledger.json
          key: job-agent-model-spend-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload local outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-output
          path: |
            output/latest_digest.html
            output/latest_digest.txt
            data/job_search_agent.sqlite
            data/model_spend_ledger.json
          if-no-files-found: ignore

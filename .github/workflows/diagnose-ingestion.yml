name: Read-only Ingestion Diagnostics

on:
  workflow_dispatch:
    inputs:
      backfill_preflight:
        description: "Count fresh stale-policy candidates, ETA and spend without evaluation or writes"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Inspect ingestion prerequisites without writes
        if: ${{ !inputs.backfill_preflight }}
        env:
          JOB_AGENT_DATABASE_URL: ${{ secrets.JOB_AGENT_DATABASE_URL }}
        run: python scripts/diagnose_ingestion.py
      - name: Plan fresh backfill without writes
        if: ${{ inputs.backfill_preflight }}
        env:
          JOB_AGENT_DATABASE_URL: ${{ secrets.JOB_AGENT_DATABASE_URL }}
        run: python scripts/preflight_backfill.py

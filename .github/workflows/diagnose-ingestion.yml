name: Read-only Ingestion Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database client
        run: python -m pip install 'psycopg[binary]>=3.2'
      - name: Inspect ingestion prerequisites without writes
        env:
          JOB_AGENT_DATABASE_URL: ${{ secrets.JOB_AGENT_DATABASE_URL }}
        run: python scripts/diagnose_ingestion.py

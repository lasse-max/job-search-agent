    - "\\bmanila\\b"
    - "\\bbangkok\\b"
    - "\\bmalaysia\\b"
    - "\\blatam\\b"
    - "\\bbrazil\\b"
    - "\\bmexico\\b"
    - "\\bdubai\\b"
    - "\\buae\\b"
    - "\\bmiddle east\\b"
    - "\\bsouth africa\\b"
  us_location_patterns:
    - "\\bunited states\\b"
    - "\\busa\\b"
    - "\\bcalifornia\\b"
    - "\\bnew york\\b"
    - "\\bsan francisco\\b"
    - "\\bsan mateo\\b"
    - "\\bseattle\\b"
    - "\\b(?:^|\\s)nyc(?:\\s|$)\\b"
    - "\\(us\\)"
  us_sponsorship_patterns:
    - "\\bvisa sponsorship\\b"
    - "\\bwill sponsor\\b"
    - "\\bsponsorship available\\b"
    - "\\bwe sponsor\\b"
    - "\\bh-?1b\\b"
    - "\\bo-?1\\b"
    - "\\bwork authorization sponsorship\\b"
  us_exceptional_role_patterns:
    - "\\bstrateg\\w*\\s*(?:&|and)?\\s*operations\\b"
    - "\\bbusiness operations\\b"
    - "\\bproduct operations\\b"
    - "\\bproduct strateg\\w*\\b"
    - "\\bgtm\\b"
    - "\\bgo-to-market\\b"
    - "\\brevenue operations\\b"
    - "\\bbusiness transformation\\b"
    - "\\bdeployment strategist\\b"
    - "\\bforward[- ]deployed strateg\\w*\\b"
    - "\\bchief of staff\\b"
